spring.application.name=human-or-ai
server.port=${PORT:8080}

# Load backend/.env (KEY=VALUE per line, same syntax as .properties) if present,
# so local dev doesn't require manually exporting GROQ_API_KEY etc. into the
# shell before running. Optional: absent in CI/production, where real env vars
# are set directly.
spring.config.import=optional:file:.env[.properties]

# ===============================
# = CORS
# ===============================
# Comma-separated list of allowed origins for REST + the STOMP handshake in
# production (e.g. https://your-frontend.onrender.com). Local dev origins
# are always allowed regardless of this value - see WebCorsConfig/WebSocketConfig.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===============================
# = DATABASE
# ===============================
# PostgreSQL connection for the user module (accounts, credentials). The
# game module itself stays fully in-memory - see InMemoryRoomRepository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/palinko}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Flyway (db/migration) is the only source of truth for the schema - never
# let Hibernate auto-generate or alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
# Interval for DatabaseKeepAliveTask's SELECT 1 ping, which stops cloud
# Postgres providers with an auto-suspend free tier (e.g. Neon, 5 min
# idle timeout) from putting the database to sleep between requests.
app.db.keep-alive.interval-seconds=${DB_KEEP_ALIVE_INTERVAL_SECONDS:240}

# ===============================
# = AUTH / JWT
# ===============================
# HMAC secret used to sign/verify JWTs - see Auth0TokenIssuer. Override with
# a long random value in any real deployment; the fallback below is only
# safe for local development.
app.auth.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}
app.auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
# Toggles the email verification flow for new signups. Left OFF by default
# so local development/debugging never needs a working SMTP account: a new
# user is created already enabled and can log in immediately. Flip to true
# (and configure SMTP below) to require email verification before login.
app.auth.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
# Base URL used to build the verification/reset links sent by email - must
# point at the frontend (Vite dev server locally), not the backend itself.
app.auth.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# ===============================
# = MAIL
# ===============================
# Only used when app.auth.email-verification.enabled=true. For Gmail, use
# an app password: https://myaccount.google.com/apppasswords
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Actuator's mail health indicator pings the SMTP host on every /actuator/health
# call; with verification disabled (the default) no SMTP is configured, so
# leaving this on would report the whole app DOWN for an integration that is
# intentionally unused.
management.health.mail.enabled=false

# ===============================
# = GROQ (word relation checker)
# ===============================
# API key for the Groq-backed WordRelationChecker adapter. Set via the
# GROQ_API_KEY environment variable; left blank here so no secret is
# committed to the repo. See GroqWordRelationChecker.
groq.api-key=${GROQ_API_KEY:}

# ===============================
# = OPENROUTER (word relation checker fallback)
# ===============================
# API key for the OpenRouter-backed WordRelationChecker adapter, used as a
# fallback when Groq's daily/token rate limit is hit. Set via the
# OPENROUTER_API_KEY environment variable. See OpenRouterWordRelationChecker
# and FallbackWordRelationChecker.
openrouter.api-key=${OPENROUTER_API_KEY:}

# ===============================
# = GAME
# ===============================
# Time (seconds) each round phase stays open before the server forces an advance.
game.round.answer-time-seconds=45
game.round.vote-time-seconds=30

# Housekeeping: how often the cleanup sweep runs, and how long an idle room survives.
game.cleanup.sweep-interval-seconds=60
game.cleanup.finished-room-ttl-seconds=300
game.cleanup.idle-room-ttl-seconds=1800
# A LOBBY that nobody starts gets a much shorter leash than an idle in-progress game.
game.cleanup.lobby-room-ttl-seconds=600
# A room with zero connected players is kept around this long before being deleted, in case the last player (often the host) is just having a momentary connection issue.
game.cleanup.empty-room-ttl-seconds=120
# How long the room is kept alive after the host disconnects, in case they reconnect, before the room is closed and deleted.
game.cleanup.host-reconnect-window-seconds=120
# How long a disconnected (non-host) player's seat and score are held for them to reclaim by reconnecting.
game.cleanup.player-reconnect-window-seconds=300

# ===============================
# = RATE LIMITING
# ===============================
# Maximum requests a single client IP may make per UTC day, to blunt abuse (see RateLimitFilter).
game.rate-limit.max-requests-per-day=200

# Per-player cap on word submissions over the STOMP/WebSocket channel, which
# RateLimitFilter's per-day HTTP counter does not cover (see
# InMemoryWordSubmissionRateLimiter). Each submission costs 1-2 AI
# relatedness calls, so this is what actually protects the AI token budget
# from a player spamming words back-to-back.
game.rate-limit.word-submission.max-per-window=6
game.rate-limit.word-submission.window-seconds=10
