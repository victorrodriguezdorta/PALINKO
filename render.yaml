services:
  - type: web
    name: palinko-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Vue Router uses history mode, so direct loads of /room/:code must
      # resolve to the SPA entry point instead of the static 404 page.
      - type: rewrite
        source: /*
        destination: /index.html